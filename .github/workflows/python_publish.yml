# Workflow for uploading to pypi
name: Upload to PyPi

# Run on version release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment: pypi
    permissions: # Needed for trusted publishing
        id-token: write

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ vars.MAIN_PY_VER }}
        
    - name: Build package
      run: uv build
      
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1.12


  update_citation:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.PAT }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ vars.MAIN_PY_VER }}

    - name: Install dependencies
      run: |
        uv sync

    - name: Update citation file
      run: uv run .github/workflows/update_citation.py

    # The repo is currently detached from HEAD, using a worktree to commit on main
    - name: Switch to worktree
      run: |
        git worktree add ../main_worktree main
        # Copy the updated file to the main worktree
        cp CITATION.cff ../main_worktree/CITATION.cff

    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: Update CITATION.cff file
        repository: ../main_worktree
        branch: main
        